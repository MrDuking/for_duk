<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Câu chuyện của Duk</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        background: #000;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      canvas {
        display: block;
      }

      /* ── Title Screen ───────────────────────────────────────────── */
      #title-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #0d1b2a 0%, #000 100%);
        z-index: 100;
        transition: opacity 1s ease;
      }

      #title-screen h1 {
        font-size: clamp(2rem, 6vw, 4.5rem);
        color: #e8d5b7;
        text-align: center;
        letter-spacing: 4px;
        text-shadow: 0 0 40px rgba(255, 200, 100, 0.6);
        animation: glow 3s ease-in-out infinite alternate;
      }

      #title-screen p {
        margin-top: 1.2rem;
        font-size: clamp(0.9rem, 2vw, 1.2rem);
        color: #aab8c2;
        letter-spacing: 2px;
      }

      #start-btn {
        margin-top: 3rem;
        padding: 0.9rem 2.8rem;
        font-size: 1.1rem;
        letter-spacing: 2px;
        color: #0d1b2a;
        background: linear-gradient(135deg, #e8d5b7, #f0a500);
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 0 20px rgba(240, 165, 0, 0.5);
      }

      #start-btn:hover {
        transform: scale(1.06);
        box-shadow: 0 0 35px rgba(240, 165, 0, 0.8);
      }

      @keyframes glow {
        from { text-shadow: 0 0 20px rgba(255, 200, 100, 0.4); }
        to   { text-shadow: 0 0 60px rgba(255, 200, 100, 0.9), 0 0 100px rgba(255, 140, 0, 0.4); }
      }

      /* ── HUD ────────────────────────────────────────────────────── */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        display: none;
      }

      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 18px;
        height: 18px;
        opacity: 0.6;
      }

      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: #fff;
        border-radius: 2px;
      }

      #crosshair::before {
        width: 2px;
        height: 100%;
        left: 50%;
        transform: translateX(-50%);
      }

      #crosshair::after {
        width: 100%;
        height: 2px;
        top: 50%;
        transform: translateY(-50%);
      }

      #controls-hint {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.55);
        color: #ccc;
        padding: 0.5rem 1.4rem;
        border-radius: 30px;
        font-size: 0.78rem;
        letter-spacing: 1px;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255,255,255,0.1);
      }

      #chapter-label {
        position: absolute;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        color: #e8d5b7;
        font-size: 1rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        opacity: 0;
        transition: opacity 0.6s ease;
        text-shadow: 0 0 12px rgba(255,200,100,0.6);
        background: rgba(0,0,0,0.4);
        padding: 0.4rem 1.4rem;
        border-radius: 30px;
        backdrop-filter: blur(4px);
      }

      /* ── Story Dialog ───────────────────────────────────────────── */
      #story-dialog {
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        width: min(680px, 90vw);
        background: rgba(8, 16, 28, 0.88);
        border: 1px solid rgba(232, 213, 183, 0.35);
        border-radius: 16px;
        padding: 1.6rem 2rem;
        color: #e8d5b7;
        z-index: 20;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease, transform 0.5s ease;
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 40px rgba(0,0,0,0.7);
      }

      #story-dialog.visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
      }

      #story-dialog h2 {
        font-size: 1.05rem;
        letter-spacing: 2px;
        color: #f0a500;
        margin-bottom: 0.7rem;
        text-transform: uppercase;
      }

      #story-dialog p {
        font-size: 0.95rem;
        line-height: 1.75;
        color: #cdd5db;
      }

      #story-close {
        display: block;
        margin: 1rem auto 0;
        padding: 0.4rem 1.6rem;
        background: transparent;
        border: 1px solid rgba(232, 213, 183, 0.4);
        border-radius: 20px;
        color: #e8d5b7;
        cursor: pointer;
        font-size: 0.85rem;
        letter-spacing: 1px;
        transition: background 0.2s, color 0.2s;
        pointer-events: auto;
      }

      #story-close:hover {
        background: rgba(232, 213, 183, 0.15);
      }

      /* ── Progress bar ───────────────────────────────────────────── */
      #progress-bar {
        position: fixed;
        top: 0;
        left: 0;
        height: 3px;
        background: linear-gradient(90deg, #f0a500, #e8d5b7);
        width: 0%;
        z-index: 30;
        transition: width 0.8s ease;
        box-shadow: 0 0 8px rgba(240,165,0,0.7);
      }
    </style>
  </head>
  <body>
    <!-- Title screen -->
    <div id="title-screen">
      <h1>CÂU CHUYỆN CỦA DUK</h1>
      <p>Một hành trình 3D qua cuộc đời</p>
      <button id="start-btn">BẮT ĐẦU HÀNH TRÌNH</button>
    </div>

    <!-- HUD (shown after game starts) -->
    <div id="hud">
      <div id="crosshair"></div>
      <div id="chapter-label"></div>
      <div id="controls-hint">
        WASD / ↑↓←→ — Di chuyển &nbsp;|&nbsp; Chuột — Nhìn xung quanh &nbsp;|&nbsp; Click để khám phá
      </div>
    </div>

    <!-- Story dialog -->
    <div id="story-dialog">
      <h2 id="dialog-title"></h2>
      <p id="dialog-body"></p>
      <button id="story-close">Tiếp tục</button>
    </div>

    <!-- Story progress bar -->
    <div id="progress-bar"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
